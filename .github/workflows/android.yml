name: Android build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0 (publishes it and announces on Discord). Leave empty for a test build."
        required: false
        type: string
      announce_only:
        description: "Only (re)post the Discord announcement for an existing release of this version"
        required: false
        type: boolean
        default: false

# Third-party actions are pinned to exact commits (tags can be moved).
env:
  # Stable link that always serves the newest release (keep the asset name fixed).
  LATEST_APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/AppDownloader.apk
  # SHA-256 of the release signing certificate; releases signed with anything else are refused.
  EXPECTED_CERT_SHA256: f911e337feb11b96bdb68f0696f9becc48e6bbbd66d2ce9d0325d61b16b59ad4

jobs:
  # Every push and pull request: tests, lint and test builds. No secrets, no signing key.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check release scripts and notes
        run: |
          shellcheck .github/scripts/*.sh
          top=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | tr -d '#[] ')
          echo "Newest changelog version: $top"
          STRICT=1 .github/scripts/release-notes.sh "$top" > "$RUNNER_TEMP/notes.md"
          DRY_RUN=1 VERSION="$top" RELEASE_URL=https://example.invalid DOWNLOAD_URL="$LATEST_APK_URL" \
            NOTES_FILE="$RUNNER_TEMP/notes.md" AFTV_CODE=9697744 .github/scripts/discord-notify.sh > "$RUNNER_TEMP/payload.json"
          len=$(jq -r '.embeds[0].description | length' "$RUNNER_TEMP/payload.json")
          echo "Discord embed length: $len"
          [ "$len" -le 4096 ]

      - name: Test, lint and build
        env:
          # Test builds are marked so they can't be mistaken for (or update over) real releases.
          APP_VERSION_SUFFIX: -dev+${{ github.sha }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload test APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AppDownloader-test-apks
          path: app/build/outputs/apk/*/*.apk

  # Releases only: a pushed v1.2.3 tag, or "Run workflow" with a version entered.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # All tags, to compare versions.

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          ANNOUNCE_ONLY: ${{ inputs.announce_only }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          # No leading zeros (1.07.1 would collide with 1.7.1); minor and patch below 100.
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "::error::Versions must look like 1.2.3 (no leading zeros; minor and patch below 100), got $version"
            exit 1
          fi
          echo "APP_VERSION_NAME=$version" >> "$GITHUB_ENV"
          # Already published with its APK? Then don't publish or announce again (re-runs are safe).
          if gh release view "v$version" --json isDraft,assets --jq '(.isDraft | not) and ([.assets[].name] | index("AppDownloader.apk") != null)' 2>/dev/null | grep -q true; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already published."
            exit 0
          fi
          if [ "$ANNOUNCE_ONLY" = "true" ]; then
            echo "::error::announce_only needs an existing published release v$version"
            exit 1
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
          # Must be newer than every earlier release (on a tag push the tag itself is excluded).
          highest=$(git tag -l 'v*' | grep -vx "v$version" | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -n "$highest" ] && [ "$(printf '%s\n%s\n' "$highest" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "::error::$version is not newer than the latest release $highest"
            exit 1
          fi

      - name: Write release notes
        env:
          AFTV_CODE: ${{ vars.AFTV_CODE || '9697744' }}
        run: |
          # Before building: a missing changelog section stops here, before anything is published.
          STRICT=1 .github/scripts/release-notes.sh "$APP_VERSION_NAME" > "$RUNNER_TEMP/notes.md"
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "## How to install"
            echo "Works on Android phones, tablets, Fire TV and Android TV."
            if [ -n "$AFTV_CODE" ]; then
              echo "- **Phone or tablet:** open https://aftv.news/$AFTV_CODE in your browser and install the download"
              echo "- **TV:** in the Downloader app, enter code **$AFTV_CODE**"
            fi
            echo "- **Direct download (always the latest version):** $LATEST_APK_URL"
            echo "- Already installed? Open App Downloader and it will offer the update."
          } > "$RUNNER_TEMP/release-body.md"

      - name: Decode signing key
        if: steps.version.outputs.exists != 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Releases need the SIGNING_* repository secrets (see README)."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release
        if: steps.version.outputs.exists != 'true'
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify signature and prepare files
        if: steps.version.outputs.exists != 'true'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AppDownloader.apk
          cert=$("$apksigner" verify --print-certs dist/AppDownloader.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          if [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signed with an unexpected certificate ($cert); refusing to publish."
            exit 1
          fi
          (cd dist && sha256sum AppDownloader.apk > AppDownloader.apk.sha256)

      - name: Upload release APK
        if: steps.version.outputs.exists != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AppDownloader-${{ env.APP_VERSION_NAME }}
          path: dist/*

      # Created as a draft with its files first, then published, so a release is never visible half-made.
      - name: Create draft release
        if: steps.version.outputs.exists != 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: App Downloader ${{ env.APP_VERSION_NAME }}
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            dist/AppDownloader.apk
            dist/AppDownloader.apk.sha256
          draft: true

      - name: Publish release
        id: publish
        if: steps.version.outputs.exists != 'true'
        run: |
          gh release edit "v$APP_VERSION_NAME" --draft=false --latest
          echo "url=$(gh release view "v$APP_VERSION_NAME" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Announce on Discord
        if: steps.version.outputs.exists != 'true' || inputs.announce_only
        continue-on-error: true # The release is already out; a failed post can be retried with announce_only.
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AFTV_CODE: ${{ vars.AFTV_CODE || '9697744' }}
          VERSION: ${{ env.APP_VERSION_NAME }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/v${{ env.APP_VERSION_NAME }}
          DOWNLOAD_URL: ${{ env.LATEST_APK_URL }}
          NOTES_FILE: ${{ runner.temp }}/notes.md
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret not set; skipping announcement."
            exit 0
          fi
          .github/scripts/discord-notify.sh
